<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Choosing the first person to hire from a short list of candidates">
  <rect width="1200" height="760" fill="#eef3f9"/>
  <circle cx="180" cy="180" r="140" fill="#1e90ff" opacity=".12"/>
  <circle cx="1030" cy="620" r="120" fill="#ffd700" opacity=".26"/>

  <!-- candidate card 1 -->
  <g transform="translate(120 210)">
    <rect x="0" y="0" width="300" height="360" rx="16" fill="#ffffff" stroke="#d4dde7" stroke-width="3"/>
    <circle cx="150" cy="100" r="52" fill="#dbe3ec"/>
    <circle cx="150" cy="84" r="22" fill="#ffffff"/>
    <path d="M114 130a36 36 0 0 1 72 0z" fill="#ffffff"/>
    <rect x="80" y="188" width="140" height="14" rx="7" fill="#0b0b0b" opacity=".7"/>
    <g fill="#dbe3ec">
      <rect x="60" y="224" width="180" height="10" rx="5"/>
      <rect x="80" y="252" width="140" height="10" rx="5"/>
    </g>
    <rect x="95" y="292" width="110" height="34" rx="8" fill="#eef3f9"/>
  </g>

  <!-- candidate card 2, chosen -->
  <g transform="translate(450 165)">
    <rect x="0" y="0" width="300" height="410" rx="16" fill="#ffffff" stroke="#ffd700" stroke-width="6"/>
    <circle cx="150" cy="115" r="60" fill="#1e90ff"/>
    <circle cx="150" cy="97" r="25" fill="#ffffff"/>
    <path d="M109 148a41 41 0 0 1 82 0z" fill="#ffffff"/>
    <rect x="75" y="212" width="150" height="16" rx="8" fill="#0b0b0b" opacity=".85"/>
    <g fill="#c3cedb">
      <rect x="55" y="252" width="190" height="10" rx="5"/>
      <rect x="75" y="280" width="150" height="10" rx="5"/>
    </g>
    <rect x="85" y="322" width="130" height="40" rx="8" fill="#1e90ff"/>
    <!-- gold tick -->
    <g transform="translate(248 -12)">
      <circle cx="0" cy="0" r="34" fill="#ffd700"/>
      <path d="M-13 1l9 10 18-21" fill="none" stroke="#0b0b0b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- candidate card 3 -->
  <g transform="translate(780 210)">
    <rect x="0" y="0" width="300" height="360" rx="16" fill="#ffffff" stroke="#d4dde7" stroke-width="3"/>
    <circle cx="150" cy="100" r="52" fill="#dbe3ec"/>
    <circle cx="150" cy="84" r="22" fill="#ffffff"/>
    <path d="M114 130a36 36 0 0 1 72 0z" fill="#ffffff"/>
    <rect x="80" y="188" width="140" height="14" rx="7" fill="#0b0b0b" opacity=".7"/>
    <g fill="#dbe3ec">
      <rect x="60" y="224" width="180" height="10" rx="5"/>
      <rect x="80" y="252" width="140" height="10" rx="5"/>
    </g>
    <rect x="95" y="292" width="110" height="34" rx="8" fill="#eef3f9"/>
  </g>

  <rect x="60" y="640" width="1080" height="14" rx="7" fill="#0b0b0b" opacity=".75"/>
</svg>
