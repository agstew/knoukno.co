<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Answers written in a workbook, graded and ranked">
  <rect width="1200" height="760" fill="#eef3f9"/>
  <circle cx="220" cy="170" r="140" fill="#1e90ff" opacity=".12"/>
  <circle cx="1000" cy="610" r="120" fill="#ffd700" opacity=".26"/>

  <!-- question card, faded -->
  <g transform="translate(140 150)">
    <rect x="0" y="0" width="470" height="180" rx="14" fill="#ffffff" stroke="#d4dde7" stroke-width="3"/>
    <rect x="36" y="36" width="90" height="14" rx="7" fill="#1e90ff"/>
    <g fill="#dbe3ec">
      <rect x="36" y="76" width="390" height="11" rx="5.5"/>
      <rect x="36" y="106" width="350" height="11" rx="5.5"/>
      <rect x="36" y="136" width="300" height="11" rx="5.5"/>
    </g>
  </g>

  <!-- answer sheet, in focus -->
  <g transform="translate(300 300)">
    <rect x="0" y="0" width="620" height="330" rx="16" fill="#ffffff" stroke="#c8d3e0" stroke-width="3"/>
    <rect x="0" y="0" width="620" height="10" rx="5" fill="#ffd700"/>
    <rect x="44" y="52" width="160" height="16" rx="8" fill="#0b0b0b" opacity=".85"/>

    <!-- handwritten answer lines -->
    <g fill="none" stroke="#0b0b0b" stroke-width="5" stroke-linecap="round" opacity=".72">
      <path d="M44 118c22-16 34 10 56-4s34 12 56-4 34 10 56-4 34 12 56-4"/>
      <path d="M44 172c26-14 40 10 66-4s40 12 66-4 40 10 66-4"/>
      <path d="M44 226c20-14 32 10 52-4s32 12 52-4 32 10 52-4 32 12 52-4"/>
    </g>
    <g fill="#dbe3ec">
      <rect x="44" y="272" width="230" height="10" rx="5"/>
    </g>

    <!-- grade badge -->
    <g transform="translate(548 62)">
      <circle cx="0" cy="0" r="46" fill="#1e90ff"/>
      <text x="0" y="16" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="#ffffff">A</text>
    </g>
  </g>

  <!-- ranking chips -->
  <g transform="translate(880 210)">
    <g>
      <rect x="0" y="0" width="180" height="62" rx="12" fill="#1e90ff"/>
      <text x="30" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff">1</text>
      <rect x="66" y="26" width="88" height="10" rx="5" fill="#ffffff" opacity=".7"/>
    </g>
    <g transform="translate(0 82)">
      <rect x="0" y="0" width="180" height="62" rx="12" fill="#ffd700"/>
      <text x="30" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b">2</text>
      <rect x="66" y="26" width="88" height="10" rx="5" fill="#0b0b0b" opacity=".45"/>
    </g>
    <g transform="translate(0 164)">
      <rect x="0" y="0" width="180" height="62" rx="12" fill="#ffffff" stroke="#c8d3e0" stroke-width="3"/>
      <text x="30" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b">3</text>
      <rect x="66" y="26" width="88" height="10" rx="5" fill="#dbe3ec"/>
    </g>
  </g>
</svg>
