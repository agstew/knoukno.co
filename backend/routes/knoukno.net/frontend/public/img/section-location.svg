<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="A storefront on a street with a map pin marking the location">
  <rect width="1200" height="760" fill="#eef3f9"/>
  <circle cx="1000" cy="180" r="150" fill="#1e90ff" opacity=".13"/>

  <!-- neighbouring buildings -->
  <rect x="80" y="300" width="200" height="330" rx="8" fill="#ffffff" stroke="#d4dde7" stroke-width="3"/>
  <g fill="#dbe3ec">
    <rect x="115" y="340" width="55" height="55" rx="6"/><rect x="190" y="340" width="55" height="55" rx="6"/>
    <rect x="115" y="425" width="55" height="55" rx="6"/><rect x="190" y="425" width="55" height="55" rx="6"/>
  </g>
  <rect x="920" y="340" width="200" height="290" rx="8" fill="#ffffff" stroke="#d4dde7" stroke-width="3"/>
  <g fill="#dbe3ec">
    <rect x="955" y="380" width="55" height="55" rx="6"/><rect x="1030" y="380" width="55" height="55" rx="6"/>
    <rect x="955" y="465" width="55" height="55" rx="6"/><rect x="1030" y="465" width="55" height="55" rx="6"/>
  </g>

  <!-- the shop -->
  <rect x="320" y="250" width="560" height="380" rx="10" fill="#ffffff" stroke="#c8d3e0" stroke-width="3"/>
  <rect x="320" y="250" width="560" height="70" rx="10" fill="#0b0b0b"/>
  <rect x="400" y="275" width="400" height="20" rx="10" fill="#ffd700"/>

  <!-- awning -->
  <g>
    <path d="M320 320h560v56H320z" fill="#1e90ff"/>
    <path d="M320 376h70l14-56h-70zM460 376h70l14-56h-70zM600 376h70l14-56h-70zM740 376h70l14-56h-70z" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- windows and door -->
  <rect x="360" y="420" width="180" height="150" rx="8" fill="#dbe9f8" stroke="#c8d3e0" stroke-width="3"/>
  <rect x="660" y="420" width="180" height="150" rx="8" fill="#dbe9f8" stroke="#c8d3e0" stroke-width="3"/>
  <rect x="565" y="420" width="70" height="210" rx="6" fill="#1e90ff"/>
  <circle cx="622" cy="530" r="7" fill="#ffd700"/>

  <!-- pavement -->
  <rect x="60" y="630" width="1080" height="16" rx="8" fill="#0b0b0b" opacity=".82"/>
  <g fill="#0b0b0b" opacity=".25">
    <rect x="120" y="662" width="90" height="8" rx="4"/><rect x="250" y="662" width="90" height="8" rx="4"/>
    <rect x="380" y="662" width="90" height="8" rx="4"/><rect x="510" y="662" width="90" height="8" rx="4"/>
    <rect x="640" y="662" width="90" height="8" rx="4"/><rect x="770" y="662" width="90" height="8" rx="4"/>
    <rect x="900" y="662" width="90" height="8" rx="4"/>
  </g>

  <!-- map pin -->
  <g transform="translate(600 110)">
    <path d="M0 0a78 78 0 0 0-78 78c0 58 78 132 78 132s78-74 78-132A78 78 0 0 0 0 0z" fill="#ffd700" stroke="#0b0b0b" stroke-width="6" stroke-opacity=".25"/>
    <circle cx="0" cy="76" r="30" fill="#0b0b0b"/>
  </g>
</svg>
